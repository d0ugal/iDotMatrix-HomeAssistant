display_moon:
  name: Display moon
  description: Render the current moon phase and upload it to the display. Becomes the new default.
  fields:
    display_for:
      name: Display for
      description: Revert to the previous default after this many seconds.
      required: false
      selector:
        number:
          min: 1
          mode: box
          unit_of_measurement: seconds
    tint:
      name: Tint
      description: >-
        Recolour the moon, so its colour can carry meaning - golden when it is
        actually visible outside, say. White becomes this colour and the black
        background is left alone. Omit for the default greyscale render.
      required: false
      example: "[255, 200, 80]"
      selector:
        color_rgb:

display_now_playing:
  name: Display now playing
  description: Show album art with scrolling track/artist overlay from a media player. Becomes the new default.
  fields:
    entity_id:
      name: Media player
      description: The media player entity to read art and metadata from.
      required: true
      selector:
        entity:
          domain: media_player
    display_for:
      name: Display for
      description: Revert to the previous default after this many seconds.
      required: false
      selector:
        number:
          min: 1
          mode: box
          unit_of_measurement: seconds

display_image:
  name: Display image
  description: Upload any image or animated GIF. Centre-cropped and resized to 64×64. Becomes the new default unless display_for is set.
  fields:
    path:
      name: Path
      description: Absolute path to a PNG, JPG, or GIF file. Mutually exclusive with entity_id and url.
      required: false
      example: /config/www/doorbell.gif
      selector:
        text:
    entity_id:
      name: Camera or image entity
      description: A camera or image entity to snapshot and display. Mutually exclusive with path and url.
      required: false
      selector:
        entity:
          domain:
            - camera
            - image
    url:
      name: URL
      description: A remote HTTP/HTTPS image URL to fetch and display. Mutually exclusive with path and entity_id. Not cached.
      required: false
      example: "https://example.com/bird.jpg"
      selector:
        text:
    line1:
      name: Line 1
      description: First line of text to overlay on the image (max 15 characters). Mutually exclusive with nothing — can be combined with any source.
      required: false
      example: "Robin"
      selector:
        text:
    line2:
      name: Line 2
      description: Second line of text to overlay on the image (max 15 characters).
      required: false
      example: "first time!"
      selector:
        text:
    position:
      name: Position
      description: Where to place the text overlay — "top" (default) or "bottom".
      required: false
      default: "top"
      example: "bottom"
      selector:
        select:
          options:
            - "top"
            - "bottom"
    fit:
      name: Fit
      description: How to fit the image to 64×64. "cover" (default) crops to fill; "contain" letterboxes the whole image with black bars on the short axis.
      required: false
      default: "cover"
      selector:
        select:
          options:
            - "cover"
            - "contain"
    display_for:
      name: Display for
      description: Revert to the previous default after this many seconds.
      required: false
      selector:
        number:
          min: 1
          mode: box
          unit_of_measurement: seconds

display_stream:
  name: Display stream
  description: >
    Repeatedly snapshot a camera entity and push frames to the display for the
    given duration.  Frame rate depends on BLE throughput — expect 1–3 FPS.
    Reverts to the default display when the duration elapses or another display
    action is triggered.
  fields:
    entity_id:
      name: Camera entity
      description: The camera entity to stream from.
      required: true
      selector:
        entity:
          domain: camera
    stream_for:
      name: Stream for
      description: How many seconds to stream before reverting to the default display.
      required: true
      selector:
        number:
          min: 1
          mode: box
          unit_of_measurement: seconds

display_emoji:
  name: Display emoji
  description: >
    Fetch a Twemoji image and display it at 64×64. Accepts the emoji character
    directly (🔔) or its name with or without colons (bell or :bell:).
    Result is cached on disk.
  fields:
    emoji:
      name: Emoji
      description: The emoji to display — character (🔔), name (bell), or colon-wrapped name (:bell:).
      required: true
      example: "bell"
      selector:
        text:
    display_for:
      name: Display for
      description: Revert to the previous default after this many seconds.
      required: false
      selector:
        number:
          min: 1
          mode: box
          unit_of_measurement: seconds
